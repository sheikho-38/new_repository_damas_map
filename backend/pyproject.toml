[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "C4", "SIM", "N", "DJ"]
ignore = [
    "E501",    # الأسطر الطويلة: نعالجها تدريجياً مع ruff format
    "DJ001",   # null=True على CharField (يحتاج migration؛ مؤجل)
    "DJ012",   # ترتيب أعضاء الموديل (مؤجل)
    "B905",    # zip(strict=...) غير ضروري هنا
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"*/tests.py" = ["N802"]